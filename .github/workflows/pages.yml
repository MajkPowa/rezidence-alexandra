name: Publish Alexandra website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_artifact: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Prepare active website
        run: |
          mkdir -p "$RUNNER_TEMP/alexandra-pages"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='assets/exterior-20261109/' \
            --exclude='assets/hero-regenerated-20261109/' \
            --exclude='assets/journey-sharp-20261026/' \
            --exclude='assets/journey-rooms-20261027/' \
            ./ "$RUNNER_TEMP/alexandra-pages/"
      - name: Apply project measurement and inquiry settings
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GA4_CLIENT_MEASUREMENT_ID: ${{ vars.GA4_CLIENT_MEASUREMENT_ID }}
          META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          FORPSI_INQUIRY_URL: ${{ vars.FORPSI_INQUIRY_URL }}
        run: python3 .github/configure_site.py "$RUNNER_TEMP/alexandra-pages"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: '${{ runner.temp }}/alexandra-pages'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded website to appear in this run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact }}
        run: |
          for attempt in {1..10}; do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id') || found=""
            if [[ -n "$ARTIFACT_ID" && "$found" == "$ARTIFACT_ID" ]]; then exit 0; fi
            sleep 3
          done
          echo "The uploaded Pages artifact is not listed for this run." >&2
          exit 1
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
